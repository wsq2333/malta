apiVersion: v1
kind: ConfigMap
metadata:
  name: malta-workflow-endpoints
  namespace: malta
  labels:
    app.kubernetes.io/part-of: malta
data:
  workflow.yaml: |
    # Copy to workflow.yaml (ignored by Git). Enable only after verifying access and storage.
    connections:
      - id: example-argo
        backend: argo
        enabled: false
        url: https://argo.example.invalid
        auth:
          type: bearer_token_file
          token_file: /var/run/secrets/malta-argo/token
        cluster: replace-execution-cluster
        namespace: replace-execution-namespace
        max_bytes: 274877906944
        timeout_seconds: 3600
        artifact_bytes: 33554432
        # Required only for result parsing; both paths must expose the same shared directory.
        remote_results_root: /results
        local_results_root: /results
