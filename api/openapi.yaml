openapi: 3.1.0
info:
  title: Malta API
  version: 0.1.0
  description: Single-instance run management and evidence-based benchmark comparison. Kubernetes execution is reserved for S5.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': {description: Server version and available executors}
  /environments:
    get:
      responses:
        '200': {description: Environment snapshots}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/environment.json'}
      responses:
        '201': {description: Registered immutable snapshot}
        '409': {description: Identifier already has different content}
  /versions:
    get:
      responses:
        '200': {description: Registered filesystem versions}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/version.json'}
      responses:
        '201': {description: Registered version}
  /runs:
    get:
      parameters:
        - {name: environment, in: query, schema: {type: string}}
        - {name: version, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string, enum: [data, metadata]}}
        - {name: status, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200': {description: Runs ordered by creation time descending}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan, request_id, source, executor]
              properties:
                plan: {$ref: '../schemas/plan.json'}
                request_id: {type: string}
                source: {type: string, enum: [human, agent, ci]}
                executor: {type: string, enum: [local]}
      responses:
        '202': {description: Submitted or existing logical Run}
        '409': {description: Request identifier conflict}
  /runs/{id}:
    parameters:
      - {$ref: '#/components/parameters/RunID'}
    get:
      responses:
        '200':
          description: Run including plan, attempt and trials
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, data]
                properties:
                  schema_version: {const: '1.0'}
                  data: {$ref: '../schemas/run.json'}
  /runs/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/RunID'}
    post:
      responses:
        '200': {description: Current state after cancellation request; poll for terminal state}
  /runs/{id}/logs:
    parameters:
      - {$ref: '#/components/parameters/RunID'}
    get:
      responses:
        '200': {description: Bounded log snapshot with truncation indicator}
  /runs/{id}/bundle:
    parameters:
      - {$ref: '#/components/parameters/RunID'}
    get:
      responses:
        '200': {description: Portable bundle with base64 files and SHA-256 hashes}
  /runs/{id}/artifacts/{path}:
    parameters:
      - {$ref: '#/components/parameters/RunID'}
      - {name: path, in: path, required: true, schema: {type: string}, description: Registered relative artifact path}
    get:
      responses:
        '200': {description: Verified original artifact bytes}
  /imports:
    post:
      description: Import a validated portable result bundle, capped at 32 MiB.
      responses:
        '201': {description: Imported or identical existing run}
        '409': {description: Run identifier has different content}
  /baselines:
    get:
      responses:
        '200': {description: Immutable baseline versions}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, run_id]
              properties:
                name: {type: string}
                run_id: {type: string}
      responses:
        '201': {description: New baseline version referencing a complete run}
  /comparisons:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [baseline, candidate]
              properties:
                baseline: {type: string, description: Baseline identifier or run identifier}
                candidate: {type: string, description: Candidate run identifier}
      responses:
        '200': {description: Comparability reasons and per-point median/min/max differences; null percentage when baseline is zero}
  /trends:
    get:
      parameters:
        - {name: run_id, in: query, required: true, schema: {type: string}, description: Anchor run defining environment and workload}
      responses:
        '200': {description: Same-environment, same-workload, same-tool successful history}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    RunID: {name: id, in: path, required: true, schema: {type: string}}
  schemas:
    ErrorEnvelope:
      type: object
      required: [schema_version, error]
      properties:
        schema_version: {const: '1.0'}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [invalid, unsupported, conflict, not_found, unauthorized, timeout, cancelled, internal]}
            message: {type: string}
