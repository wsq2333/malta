# 示例连接；请在 kubeconfig.yaml 中替换地址、CA 路径和凭证。
# 两个 context 可指向同一个集群；这里分开命名以区分部署与测试用途。
apiVersion: v1
kind: Config
clusters:
  - name: deployment-cluster
    cluster:
      server: https://deployment.example.invalid:6443
      certificate-authority: ./deployment-ca.crt
  - name: benchmark-cluster
    cluster:
      server: https://benchmark.example.invalid:6443
      certificate-authority: ./benchmark-ca.crt
users:
  - name: deployment-user
    user:
      token: REPLACE_WITH_DEPLOYMENT_TOKEN
  - name: benchmark-user
    user:
      token: REPLACE_WITH_BENCHMARK_TOKEN
contexts:
  - name: malta-deployment
    context:
      cluster: deployment-cluster
      user: deployment-user
      namespace: malta
  - name: malta-benchmark
    context:
      cluster: benchmark-cluster
      user: benchmark-user
      namespace: malta
current-context: malta-deployment
